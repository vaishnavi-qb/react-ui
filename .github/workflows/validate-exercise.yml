name: Validate exercise

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ecommerce-frontend/package-lock.json

      - name: Install backend and workflow dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix ecommerce-frontend

      - name: Install the Linux Rolldown binding
        run: npm install --no-save --include=optional --prefix ecommerce-frontend @rolldown/binding-linux-x64-gnu@1.0.0

      - name: Check backend JavaScript syntax
        run: find ecommerce-backend -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint frontend
        run: npm run lint --prefix ecommerce-frontend

      - name: Test workflow automation
        run: npm test

      - name: Build frontend
        run: npm run build --prefix ecommerce-frontend