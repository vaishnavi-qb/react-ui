name: Initialize exercises

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: initialize-exercises-${{ github.repository }}
  cancel-in-progress: false

jobs:
  initialize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the first exercise issue once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node .github/scripts/initialize-exercises.mjs